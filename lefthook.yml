pre-commit:
  files: git diff --name-only --cached
  commands:
    fmt:
      run: cargo fmt
      stage_fixed: true
    fmt-check:
      run: cargo fmt -- --check
    clippy:
      run: cargo clippy --all-targets --all-features -- -D warnings
    test:
      run: cargo test
    sqlx-prepare:
      run: DATABASE_URL=sqlite://data.db cargo sqlx prepare --check
