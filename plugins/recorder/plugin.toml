name = "recorder"
version = "0.1.0"
entry = "main.lua"
enabled = true

[config.messages]
usage = "Использование: /rec start|stop"
started = "Запись запущена"
stopped_tg = "Запись остановлена, отправляю файл..."
stopped_tt = "Запись остановлена"
caption = "Запись готова"
no_target = "Не настроен чат для отправки записи в Telegram"

[config.recording]
path_template = "recordings/tt_record_{date}_{time}.wav"
format = "wave"
auto_subscribe_audio = true
delete_after_send = true
default_notify_chat = 6409603928
