[package]
name = "teamtalk"
version = "1.2.0"
edition = "2024"
authors = ["BlindMaster24"]
description = "TeamTalk SDK for Rust"
license = "MIT"
repository = "https://github.com/BlindMaster24/TeamTalkRust"
homepage = "https://github.com/BlindMaster24/TeamTalkRust"

[features]
default = ["tls-native"]
dispatch = []
async = ["dep:futures"]
async-tokio = ["async", "dep:tokio"]
logging = ["dep:tracing"]
mock = ["dispatch"]
offline = []
scripts = ["dep:mlua"]
plugins = ["dep:libloading"]
tls-native = ["reqwest/native-tls"]
tls-rustls = ["reqwest/rustls-tls"]

[dependencies]
teamtalk-sys = { version = "0.1.0" }
thiserror = "2.0"
evalexpr = "13.1"
rand = "0.8"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
sevenz-rust2 = "0.20"
dirs = "6.0"
once_cell = "1.20"
futures = { version = "0.3", optional = true }
tokio = { version = "1.36", features = ["rt", "sync", "time"], optional = true }
tracing = { version = "0.1", optional = true }
mlua = { version = "0.11", features = ["lua54", "vendored"], optional = true }
libloading = { version = "0.8", optional = true }

[package.metadata.docs.rs]
all-features = true

[dev-dependencies]
insta = "1.46.1"
pretty_assertions = "1.4.1"
proptest = "1.9.0"
rstest = "0.26.1"
